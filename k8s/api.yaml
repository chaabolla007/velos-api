apiVersion: apps/v1
kind: Deployment
metadata:
  name: velos-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: velos-api
  template:
    metadata:
      labels:
        app: velos-api
    spec:
      containers:
        - name: api
          image: chaabollla/velos-api:1.0
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: velos-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /sante
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: velos-api
spec:
  selector:
    app: velos-api
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
