apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: velos-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velos-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velos-db
  template:
    metadata:
      labels:
        app: velos-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: velos
            - name: POSTGRES_USER
              value: velos
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: velos-db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql/data
            - name: initialisation
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - velos
                - -d
                - velos
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: donnees
          persistentVolumeClaim:
            claimName: velos-db-data
        - name: initialisation
          configMap:
            name: velos-db-init

---
apiVersion: v1
kind: Service
metadata:
  name: velos-db
spec:
  selector:
    app: velos-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
